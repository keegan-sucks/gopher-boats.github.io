<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>keegan.sucks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#282828;        /* gruvbox dark bg */
    --fg:#ebdbb2;        /* gruvbox cream    */
    --dim:#a89984;       /* gruvbox gray     */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"Special Elite","Courier New",ui-monospace,monospace;
    min-height:100dvh;
    display:flex;
    align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    padding-inline:clamp(1.75rem,12vw,11rem);
    max-width:46rem;
  }
  .icon{
    width:clamp(84px,11vw,128px);
    height:auto;
    display:block;
    margin-bottom:clamp(2rem,4vw,3rem);
  }
  h1{
    font-weight:400;
    font-size:clamp(1.9rem,5.2vw,3.6rem);
    line-height:1.12;
    letter-spacing:-0.005em;
  }
  .code{
    margin-top:clamp(1.1rem,2.2vw,1.6rem);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(.8rem,1.3vw,1rem);
    letter-spacing:.18em;
    color:var(--dim);
    text-transform:uppercase;
    text-decoration:none;
    display:inline-block;
    transition:color .15s ease;
  }
  .code:hover,
  .code:focus-visible{color:var(--fg)}
  .code:focus-visible{outline:2px solid var(--fg);outline-offset:6px}
  /* subtle entrance */
  .reveal{opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
  .reveal:nth-child(2){animation-delay:.08s}
  .reveal:nth-child(3){animation-delay:.16s}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;animation:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <svg class="icon reveal" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
         fill="none" stroke="var(--fg)" stroke-width="11" stroke-linejoin="miter" stroke-linecap="square">
      <!-- document body with folded top-right corner -->
      <path d="M16 10 H84 L104 30 V140 H16 Z"/>
      <!-- the fold -->
      <path d="M84 10 V30 H104"/>
      <!-- eyes -->
      <rect x="40" y="52" width="13" height="13" fill="var(--fg)" stroke="none"/>
      <rect x="66" y="52" width="13" height="13" fill="var(--fg)" stroke="none"/>
      <!-- frown -->
      <polyline points="40,104 40,94 80,94 80,104"/>
    </svg>

    <h1 class="reveal">This page is not available</h1>
    <a class="code reveal" href="mailto:email@keegan.sucks">ERR_DEVELOPER_TOO_LAZY</a>
  </main>
</body>
</html>
